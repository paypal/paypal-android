query GetFundingEligibility(
  $merchantID: [String],
  $enableFunding: [SupportedPaymentMethodsType],
  $buyerCountry: CountryCodes
) {
    fundingEligibility(
        merchantId: $merchantID,
        enableFunding: $enableFunding,
        buyerCountry: $buyerCountry
    ) {
        venmo {
            eligible
            reasons
        }
    }
}
