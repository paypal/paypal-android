name: Upload Demo APK to Firebase
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Extra release notes (branch, commit SHA and changes since last upload are always appended)'
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  upload_demo_apk:
    name: Build and Upload Demo APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'
      - name: Decode Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "${GOOGLE_SERVICES_JSON_BASE64}" | base64 -d > "${RUNNER_TEMP}/google-services.json"
          APP_ID=$(jq -r '.client[] | select(.client_info.android_client_info.package_name == "com.paypal.android") | .client_info.mobilesdk_app_id' "${RUNNER_TEMP}/google-services.json")
          if [ -z "${APP_ID}" ] || [ "${APP_ID}" = "null" ]; then
            echo "Could not find Firebase app ID for com.paypal.android in google-services.json" >&2
            exit 1
          fi
          echo "FIREBASE_APP_ID=${APP_ID}" >> "$GITHUB_ENV"
      - name: Write Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "${FIREBASE_SERVICE_ACCOUNT}" > "${RUNNER_TEMP}/firebase-service-account.json"
          echo "FIREBASE_SERVICE_ACCOUNT_FILE=${RUNNER_TEMP}/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Build Release Notes
        env:
          INPUT_NOTES: ${{ inputs.release_notes }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: upload_demo_to_firebase.yml
        run: |
          NOTES_FILE="${RUNNER_TEMP}/release_notes.txt"
          : > "${NOTES_FILE}"
          if [ -n "${INPUT_NOTES}" ]; then
            printf '%s\n\n' "${INPUT_NOTES}" >> "${NOTES_FILE}"
          fi
          echo "Branch: ${REF_NAME} (${GITHUB_SHA::7})" >> "${NOTES_FILE}"

          # Commit of the last successful run of this workflow = last APK pushed to Firebase from CI
          PREV_SHA=$(gh run list --workflow "${WORKFLOW_FILE}" --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)

          if [ -n "${PREV_SHA}" ] && git cat-file -e "${PREV_SHA}^{commit}" 2>/dev/null; then
            BASE="${PREV_SHA}"
            HEADER="Changes since last Firebase upload (${PREV_SHA::7}):"
          else
            BASE=$(git describe --tags --abbrev=0 2>/dev/null || true)
            HEADER="Changes since last release tag (${BASE:-none}); no previous Firebase upload found:"
          fi

          if [ -n "${BASE}" ]; then
            LOG=$(git log --no-merges --pretty='- %s (%h)' "${BASE}..HEAD")
            TOTAL=$(echo "${LOG}" | grep -c . || true)
            {
              echo
              echo "${HEADER}"
              if [ "${TOTAL}" -eq 0 ]; then
                echo "- No new commits"
              else
                echo "${LOG}" | head -n 50
                if [ "${TOTAL}" -gt 50 ]; then echo "...and $((TOTAL - 50)) more"; fi
              fi
            } >> "${NOTES_FILE}"
          fi
          cat "${NOTES_FILE}"
      - name: Build and Upload Demo APK
        run: ./gradlew --stacktrace :Demo:assembleDebug :Demo:appDistributionUploadDebug --releaseNotesFile="${RUNNER_TEMP}/release_notes.txt"
